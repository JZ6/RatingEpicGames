name: Deploy DLSSdb App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:dlss
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DLSSDB_DEPLOY_KEY }}
          external_repository: JZ6/DLSSdb
          publish_branch: gh-pages
          publish_dir: apps/dlssdb/dist
